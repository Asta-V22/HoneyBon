services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: honeybon
      POSTGRES_PASSWORD: honeybon
      POSTGRES_DB: honeybon
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeybon"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
