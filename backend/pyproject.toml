[project]
name = "honeybon"
version = "0.1.0"
description = "Honeybon API and review worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "cryptography>=43",
    "httpx>=0.27",
    "anthropic>=1.11.0",
    "google-genai>=2.28.0",
    "itsdangerous>=2.2.0",
    "groq>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: calls a real LLM provider and costs money (run with -m live)"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Prompt text reads better unwrapped.
"app/reviews/prompts.py" = ["E501"]
"app/chat/prompts.py" = ["E501"]
